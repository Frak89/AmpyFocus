plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ampy.focus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ampy.focus'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    flavorDimensions 'edition'
    productFlavors {
        owner {
            dimension 'edition'
            applicationIdSuffix '.owner'
            buildConfigField 'String', 'EDITION', '"Device Owner"'
        }
        extreme {
            dimension 'edition'
            applicationIdSuffix '.extreme'
            buildConfigField 'String', 'EDITION', '"Extreme / AmpybiOS"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
