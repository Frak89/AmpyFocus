name: Android APK (two editions)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install required Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Test and build both flavors
        run: gradle --no-daemon :app:testOwnerDebugUnitTest :app:assembleOwnerDebug :app:assembleExtremeDebug
      - name: Device Owner debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpyFocus-DeviceOwner-debug
          path: app/build/outputs/apk/owner/debug/*.apk
          if-no-files-found: error
      - name: Extreme debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpyFocus-Extreme-debug
          path: app/build/outputs/apk/extreme/debug/*.apk
          if-no-files-found: error
